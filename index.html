// touch: a floating joystick on the left half, OK / TERUG buttons on the right, MENU at the top
const stick = { id: null, x: 0, y: 0, dir: null };
function stickHome() {
  if (!isTouch) return;
  const z = document.getElementById('zone').getBoundingClientRect();
  placeStick(z.width * 0.42, z.height - 90, 0, 0);
}
function placeStick(x, y, dx, dy) {
  const b = document.getElementById('base').style, k = document.getElementById('knob').style;
  b.left = x + 'px'; b.top = y + 'px'; k.left = (x + dx) + 'px'; k.top = (y + dy) + 'px';
}
function setDir(d) {
  if (d === stick.dir) return;
  if (stick.dir) keys[stick.dir] = false;
  stick.dir = d;
  if (d) keyDown(d);
}
if (isTouch) {
  document.getElementById('pad').style.display = 'block';
  const zone = document.getElementById('zone');
  zone.addEventListener('pointerdown', e => {
    e.preventDefault(); audioInit();
    if (stick.id !== null) return;
    const r = zone.getBoundingClientRect();
    stick.id = e.pointerId; stick.x = e.clientX - r.left; stick.y = e.clientY - r.top;
    try { zone.setPointerCapture(e.pointerId); } catch (err) {}
    placeStick(stick.x, stick.y, 0, 0);
  });
  zone.addEventListener('pointermove', e => {
    if (e.pointerId !== stick.id) return;
    const r = zone.getBoundingClientRect();
    let dx = e.clientX - r.left - stick.x, dy = e.clientY - r.top - stick.y;
    const d = Math.hypot(dx, dy), max = 42;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    placeStick(stick.x, stick.y, dx, dy);
    setDir(d < 14 ? null : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  const release = e => { if (e.pointerId !== stick.id) return; stick.id = null; setDir(null); stickHome(); };
  zone.addEventListener('pointerup', release); zone.addEventListener('pointercancel', release);
  for (const [id, a] of [['bz', 'a'], ['bx', 'b'], ['bs', 'start']]) {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); keyDown(a); el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (err) {} });
    const up = e => { e.preventDefault(); keys[a] = false; el.classList.remove('on'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  }
  document.addEventListener('contextmenu', e => e.preventDefault());
  stickHome();
}

function hasFriend(id) { return G.party.some(f => f.id === id); }
function daanUse() { return hasFriend('daan') ? 'Daan zou dit goed kunnen gebruiken! ...Maar Daan gebruikt de spullen niet die hij koopt.' : 'Van Daan. Hij heeft het nooit gebruikt.'; }
const itemUse = it => typeof ITEMS[it].use === 'function' ? ITEMS[it].use() : (ITEMS[it].use || 'Dit gebruik je in een gevecht.');
function bagList() { return Object.keys(ITEMS).filter(k => k === 'blikje' || k === 'kroket' || G.items[k] > 0); }
function makeFriend(id, lvl) {
  const f = { id, friend: true, name: FRIENDS[id].name, lvl, xp: 0, moves: FRIENDS[id].moves.slice() };
  calcStats(f); f.hp = f.maxhp;
  return f;
}
function calcStats(f) {
  const b = FRIENDS[f.id];
  f.maxhp = b.hp + 3 * f.lvl; f.atk = b.atk + 2 * f.lvl; f.def = b.def + 2 * f.lvl; f.spd = b.spd + 2 * f.lvl;
}
const xpNeed = lvl => 20 + lvl * 12;
function makeEnemy(id, lvl) {
  const b = ENEMIES[id];
  const e = { id, name: b.name, lvl, moves: b.moves, maxhp: Math.round(b.hp + 3 * lvl), atk: b.atk + 1.6 * lvl, def: b.def + 1.6 * lvl, spd: b.spd + 1.6 * lvl };
  e.hp = e.maxhp;
  return e;
}

const SAVE_KEY = 'pokevrienden' + (location.pathname.includes('speelversie') ? '-speel' : '-bouw');
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); return true; } catch (e) { return false; } }
function loadGame() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.party) { Object.assign(G, s); return true; } } catch (e) {} return false; }
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }

const MAPS = {};
let map = null, mapImg = null, npcs = [], player = { x: 0, y: 0, px: 0, py: 0, dir: 'down', moving: 0, step: 0, hidden: false };
let camX = 0, camY = 0, fadeA = 0, fadeTo = 0, flash = 0, overlay = null;

function loadMap(id, x, y, dir) {
  map = MAPS[id]; G.map = id;
  map.h = map.rows.length; map.w = map.rows[0].length;
  mapImg = mk(map.w * T, map.h * T);
  const g = mapImg.getContext('2d');
  for (let ty = 0; ty < map.h; ty++) for (let tx = 0; tx < map.w; tx++) g.drawImage(TILES[map.rows[ty][tx]].img, tx * T, ty * T);
  const oldCtx = ctx; // labels draw on the map image
  for (const l of map.labels || []) {
    const w = textW(l.text) + 8;
    g.fillStyle = OUT; g.fillRect(l.x - w / 2 - 1, l.y - 1, w + 2, 12);
    g.fillStyle = l.bg; g.fillRect(l.x - w / 2, l.y, w, 10);
    drawTextOn(g, l.text, l.x - w / 2 + 4, l.y + 1, l.col);
  }
  npcs = (map.npcs || []).map(n => Object.assign({ px: n.x * T, py: n.y * T, moving: 0, step: 0, dir: n.dir || 'down', path: '' }, n));
  player.x = x; player.y = y; player.px = x * T; player.py = y * T; player.dir = dir || player.dir; player.moving = 0;
  G.x = x; G.y = y; G.dir = player.dir;
  if (map.music) play(map.music);
  centerCam();
}

// ---------------------------------------------------------------- drawing: world
function drawWorld() {
  ctx.fillStyle = '#101018'; ctx.fillRect(0, 0, W, H);
  const cx = Math.round(camX), cy = Math.round(camY);
  ctx.drawImage(mapImg, -cx, -cy);
  // train
  if (train && map.id === 'perron') drawTrain(train.x - cx, 16 - cy);
  // item sparkles
  for (const pr of map.props || []) if (!(pr.hide && pr.hide())) { const img = ITEM_SPR[pr.spr]; ctx.drawImage(img, pr.x * T - cx + Math.floor((16 - img.width) / 2), pr.y * T - cy + Math.floor((16 - img.height) / 2) - 2); }
  for (const it of map.items || []) if (!G.flags['item_' + map.id + it.x + '_' + it.y] && (!it.when || it.when())) {
    const sx = it.x * T - cx, sy = it.y * T - cy;
    if (TILES[tileAt(it.x, it.y)].grass) { if (Math.floor(frame / 20) % 3 === 0) { ctx.fillStyle = '#ffffff'; ctx.fillRect(sx + 7, sy + 5, 2, 2); } }
    else { const img = ITEM_SPR[it.spr || it.item] || ITEM_SPR.blikje; ctx.drawImage(img, sx + Math.floor((16 - img.width) / 2), sy + 15 - img.height); if (Math.floor(frame / 15) % 2) { ctx.fillStyle = '#ffffff'; ctx.fillRect(sx + 13, sy + 1, 1, 3); ctx.fillRect(sx + 12, sy + 2, 3, 1); } }
  }
  // entities sorted by y
  const ents = npcs.filter(n => !isHidden(n)).map(n => ({ e: n, id: n.look }));
  if (!player.hidden) ents.push({ e: player, id: 'nino' });
  ents.sort((a, b) => a.e.py - b.e.py);
  for (const { e, id } of ents) {
    const fr = e.moving ? (Math.floor(e.step / 8) % 2 ? 1 : 2) : 0;
    const img = over(id)[e.dir + fr];
    const sx = Math.round(e.px - cx) - 1, sy = Math.round(e.py - cy) - 7;
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(sx + 4, sy + 19, 10, 3);
    ctx.drawImage(img, sx, sy);
    // tall grass covers the feet
    if (TILES[tileAt(e.x, e.y)].grass && !e.moving) ctx.drawImage(TILES.g.img, 0, 10, 16, 6, Math.round(e.px - cx), Math.round(e.py - cy) + 10, 16, 6);
  }
  for (const mk of map.markers || []) if (!mk.when || mk.when()) {
    const sx = mk.x * T - cx + 4, sy = mk.y * T - cy - 28 + Math.round(Math.sin(frame * 0.15) * 3);
    ctx.fillStyle = OUT; ctx.fillRect(sx - 1, sy - 1, 10, 7); ctx.fillRect(sx + 1, sy + 5, 6, 2); ctx.fillRect(sx + 3, sy + 7, 2, 2);
    ctx.fillStyle = '#f0c030'; ctx.fillRect(sx, sy, 8, 5); ctx.fillRect(sx + 2, sy + 5, 4, 1); ctx.fillRect(sx + 3, sy + 6, 2, 1);
  }
  if (emo) {
    const e = emo.id === 'player' ? player : npcs.find(n => n.id === emo.id);
    if (e) { const sx = Math.round(e.px - cx) + 4, sy = Math.round(e.py - cy) - 20 - Math.min(4, emo.t); ctx.fillStyle = OUT; ctx.fillRect(sx - 1, sy - 1, 10, 13); ctx.fillStyle = '#ffffff'; ctx.fillRect(sx, sy, 8, 11); ctx.fillStyle = '#d04848'; ctx.fillRect(sx + 3, sy + 2, 2, 5); ctx.fillRect(sx + 3, sy + 8, 2, 2); }
  }
}
function drawTrain(x, y) {
  for (let c = 0; c < 3; c++) {
    const cx = x + c * 100;
    ctx.fillStyle = OUT; ctx.fillRect(cx - 1, y - 1, 98, 32);
    ctx.fillStyle = '#f0f0f4'; ctx.fillRect(cx, y, 96, 30);
    ctx.fillStyle = '#d83838'; ctx.fillRect(cx, y + 20, 96, 4);
    ctx.fillStyle = '#304868'; for (let i = 0; i < 6; i++) ctx.fillRect(cx + 6 + i * 15, y + 5, 11, 10);
    ctx.fillStyle = '#88b8e0'; for (let i = 0; i < 6; i++) ctx.fillRect(cx + 7 + i * 15, y + 6, 4, 3);
    ctx.fillStyle = '#9098a8'; ctx.fillRect(cx + 40, y + 3, 14, 25);
    ctx.fillStyle = '#303038'; ctx.fillRect(cx + 10, y + 28, 10, 3); ctx.fillRect(cx + 76, y + 28, 10, 3);
  }
  ctx.fillStyle = '#f8e8a0'; ctx.fillRect(x + 294, y + 8, 2, 4);
}

// ---------------------------------------------------------------- drawing: battle
function hpCol(r) { return r > 0.5 ? '#58d068' : r > 0.2 ? '#f0c030' : '#e05050'; }
function hpBar(x, y, w, cur, max) {
  ctx.fillStyle = '#383838'; ctx.fillRect(x - 1, y - 1, w + 2, 5);
  ctx.fillStyle = '#f8f8f8'; ctx.fillRect(x, y, w, 3);
  const r = clamp(cur / max, 0, 1);
  ctx.fillStyle = hpCol(r); ctx.fillRect(x, y, Math.ceil(w * r), 3);
}

function drawDrinker(img, x, y, a) {

  const tilt = a.type === 'drink' ? clamp((t - 20) / 20, 0, 1) * (t < 100 ? 1 : clamp(1 - (t - 100) / 15, 0, 1)) : clamp((t - 10) / 10, 0, 1) * clamp(1 - (t - 30) / 10, 0, 1);
  ctx.save(); ctx.translate(x + 25, y + 48); ctx.rotate(-tilt * 0.35); ctx.drawImage(img, -25, -48); ctx.restore();
  const cx = x + 10 + tilt * 6, cy = y + 30 - tilt * 12;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-tilt * 1.9); ctx.drawImage(ITEM_SPR.blikje, -5, -7); ctx.restore();
  if (t < 26) for (let i = 0; i < 10; i++) { ctx.fillStyle = i % 2 ? '#ffffff' : '#c8e8ff'; ctx.fillRect(x + 8 + Math.cos(i) * t * 0.9, y + 22 - Math.abs(Math.sin(i * 1.7)) * t * 0.9, 2, 2); }

  if (a.type === 'drink' && t > 100) { text('AHHH!', x + 2, y - 2, '#f0c030', '#383838'); for (let i = 0; i < 5; i++) { const hy = y + 10 - ((t - 100 + i * 8) % 30); ctx.fillStyle = '#f06080'; ctx.fillRect(x + 4 + i * 10, hy, 4, 3); ctx.fillRect(x + 5 + i * 10, hy + 3, 2, 1); } }

  if (pressed.up || pressed.down) { TM.sel = (TM.sel + 1) % TM.opts.length; SFX.blip(); }

function updateNarrate() {
  const n = narr; n.t++;
  const len = n.pages[n.i].length;
  if (pressed.a || pressed.b) {

function draw() {
  switch (mode) {
    case 'title': drawTitle(); break;
    case 'narrate': drawNarrate(); break;
    case 'card': drawCard(); break;
    case 'catch': drawCatch(); break;
    case 'credits': drawCredits(); break;
    case 'battle': drawBattle(); break;
    case 'battleIntro': {
      drawWorld();
      const t = 40 - flash;
      ctx.fillStyle = '#101018';
      for (let i = 0; i < 10; i++) { const w = Math.min(W, t * 8 - i * 12); if (w > 0) ctx.fillRect(i % 2 ? W - w : 0, i * 16, w, 16); }
      break;
    }
    case 'battleOut': drawBattle(); ctx.fillStyle = 'rgba(16,16,24,' + clamp(B.outT / 20, 0, 1) + ')'; ctx.fillRect(0, 0, W, H); break;
    default: drawWorld(); if (dialog) drawDialog();
  }
  if (fadeA > 0 && mode !== 'narrate' && mode !== 'card') { ctx.fillStyle = 'rgba(16,16,24,' + fadeA + ')'; ctx.fillRect(0, 0, W, H); }
  if (MENU) drawMenu();
}

// ---------------------------------------------------------------- update + loop
function update() {
  frame++;
  if (MENU) { updateMenu(); for (const k in pressed) pressed[k] = false; return; }
  if (pressed.start && mode !== 'title') { openMenu(); for (const k in pressed) pressed[k] = false; return; }
  if (fadeA !== fadeTo) fadeA = clamp(fadeA + Math.sign(fadeTo - fadeA) * 0.08, 0, 1), (Math.abs(fadeA - fadeTo) < 0.08 && (fadeA = fadeTo));
  switch (mode) {
    case 'title': updateTitle(); break;
    case 'narrate': updateNarrate(); break;
    case 'card': cardC.t++; if (cardC.t > 60 && pressed.a) { cardC = null; mode = 'world'; done(); } break;
    case 'catch': updateCatch(); break;
    case 'credits': updateCredits(); break;
    case 'battleIntro': if (--flash <= 0) mode = 'battle'; break;
    case 'battle': updateBattle(); break;
    case 'battleOut': if (++B.outT > 24) finishBattle(); break;
    case 'world':
      if (dialog) updateDialog(); else updateWorld();
      if (!dialog) updateScript();
      break;
  }
  for (const k in pressed) pressed[k] = false;
}
let acc = 0, last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  if (!BOT) { acc += Math.min(100, now - last); while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } }
  last = now;
  musicTick();
  draw();
}
requestAnimationFrame(loop);

// test API
window.__game = {
  get mode() { return mode; }, get G() { return G; }, get B() { return B; }, get dialog() { return dialog; }, get script() { return script; },
  get player() { return player; }, get map() { return map && map.id; }, keys, pressed,
  step(n = 1) { for (let i = 0; i < n; i++) update(); draw(); },
  press(a) { pressed[a] = true; },
  warp(id, x, y, dir) { mode = 'world'; loadMap(id, x, y, dir || 'down'); fadeA = 0; fadeTo = 0; },
  run(fn) { run(fn); },
  battle(o) { run(function* () { yield battle(o); }); },
  give(id, lvl) { G.party.push(makeFriend(id, lvl)); },
};
</script>
